[project]
name = "police-thief-lab"
version = "1.0.0"
description = "Deterministic Phase 1 laboratory for Police-Thief P2P"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastmcp==3.4.3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/police_thief_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=police_thief_lab --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
exclude = ["external", "experiments"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
