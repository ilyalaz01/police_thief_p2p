<circle cx="150" cy="173.333" r="7" fill="#CC79A7"/>
<line x1="540" y1="158.274" x2="540" y2="220.85" stroke="#CC79A7"/>
<circle cx="540" cy="186.667" r="7" fill="#CC79A7"/>
<line x1="930" y1="185.162" x2="930" y2="252.101" stroke="#CC79A7"/>
<circle cx="930" cy="216.667" r="7" fill="#CC79A7"/>
<line x1="730" y1="627" x2="775" y2="627" stroke="#CC79A7" stroke-width="4"/>
<text x="790" y="633" class="legend">ScentGreedyPolice vs ScentEvasionThief</text>
</svg>
